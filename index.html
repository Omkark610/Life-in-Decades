<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Life in Decades</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Manrope:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f6f3fb; --surface:#ffffff; --ink:#1d1838; --muted:#6f6a8c; --track:#e6e1f2; --line:#ddd7ec; --l:56%; --glow:.35;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--bg:#120f2b; --surface:#1b1740; --ink:#f1edff; --muted:#a29cc9; --track:#2a2556; --line:#332d63; --l:64%; --glow:.55}
}
:root[data-theme="dark"]{--bg:#120f2b; --surface:#1b1740; --ink:#f1edff; --muted:#a29cc9; --track:#2a2556; --line:#332d63; --l:64%; --glow:.55}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Manrope,system-ui,sans-serif;line-height:1.5;min-height:100vh;-webkit-font-smoothing:antialiased}
main{max-width:720px;margin:0 auto;padding:56px 24px 72px}
h1{font-family:Fraunces,Georgia,serif;font-weight:600;font-size:clamp(2.1rem,6vw,3.2rem);line-height:1.1;letter-spacing:-.02em;margin:0 0 12px}
.lede{color:var(--muted);margin:0 0 32px;max-width:46ch}
.picker{display:flex;flex-wrap:wrap;gap:16px;margin-bottom:40px}
.field{display:flex;flex-direction:column;gap:6px;font-size:.85rem;color:var(--muted);font-weight:500}
input{font:inherit;font-size:1rem;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;min-width:170px;color-scheme:light dark}
input:focus-visible{outline:2px solid hsl(265 80% 65%);outline-offset:2px}
.summary{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:28px;margin-bottom:40px}
.summary h2{font-family:Fraunces,Georgia,serif;font-weight:400;font-size:clamp(1.4rem,4vw,1.9rem);line-height:1.25;margin:0 0 22px;letter-spacing:-.01em}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.stat b{display:block;font-family:Fraunces,Georgia,serif;font-weight:600;font-size:1.8rem;line-height:1.1}
.stat span{font-size:.85rem;color:var(--muted)}
.rows{display:grid;gap:18px}
.row{display:grid;grid-template-columns:64px 1fr 44px;align-items:center;gap:14px;font-variant-numeric:tabular-nums}
.age{font-size:.9rem;font-weight:600}
.pct{font-size:.85rem;color:var(--muted);text-align:right}
.track{position:relative;height:22px;border-radius:999px;background:var(--track)}
.fill{position:absolute;inset:0 auto 0 0;width:0;border-radius:999px;
  background:linear-gradient(90deg,hsl(var(--h) 96% calc(var(--rl) + 9%)),hsl(calc(var(--h) - 7) 94% var(--rl)));
  transition:width 1.1s cubic-bezier(.2,.8,.2,1)}
.row.now .fill::after{content:"";position:absolute;right:-1px;top:50%;width:14px;height:14px;margin-top:-7px;border-radius:50%;
  background:#fff;box-shadow:0 0 0 4px hsl(var(--h) 95% var(--rl) / var(--glow)),0 0 18px hsl(var(--h) 95% var(--rl))}
.empty{color:var(--muted);margin:0}
.note{margin-top:32px;font-size:.8rem;color:var(--muted)}
@media (max-width:520px){main{padding:40px 18px 56px}.row{grid-template-columns:52px 1fr 40px;gap:10px}.stats{grid-template-columns:1fr 1fr}.summary{padding:22px}input{min-width:0;width:100%}.field{flex:1 1 140px}}
@media (prefers-reduced-motion:reduce){.fill{transition:none}}
</style>
</head>
<body>
<main>
  <h1>Your life, one decade at a time</h1>
  <p class="lede">Enter your birth month to see how much of each decade you have already lived.</p>

  <div class="picker">
    <label class="field">Birth month
      <input type="month" id="dob" max="">
    </label>
    <label class="field">Planning for age
      <input type="number" id="span" value="100" min="40" max="120" step="1">
    </label>
  </div>

  <section class="summary" id="summary" aria-live="polite">
    <p class="empty">Pick your birth month to begin.</p>
  </section>

  <div class="rows" id="rows"></div>
  <p class="note">Bars show age ranges: 0–10, 10–20, and so on. Life expectancy is a planning figure, not a prediction.</p>
</main>

<script>
// Light apricot to deep burnt orange across the ten decades
const HUES=[40,37,34,31,28,25,22,19,16,13];
const LIGHT=[74,70,66,62,58,54,50,46,42,38];
const dobEl=document.getElementById('dob'), spanEl=document.getElementById('span');
const rowsEl=document.getElementById('rows'), sumEl=document.getElementById('summary');
const now=new Date();
dobEl.max=now.getFullYear()+'-'+String(now.getMonth()+1).padStart(2,'0');

// Build the ten rows once so bars can animate between values
const rows=HUES.map((h,i)=>{
  const el=document.createElement('div');
  el.className='row'; el.style.setProperty('--h',h); el.style.setProperty('--rl',LIGHT[i]+'%');
  el.innerHTML=`<span class="age">${i*10}–${i*10+10}</span><div class="track"><div class="fill"></div></div><span class="pct">0%</span>`;
  rowsEl.appendChild(el);
  return el;
});

function render(){
  const v=dobEl.value;
  const span=Math.min(120,Math.max(40,parseInt(spanEl.value)||100));
  if(!v){
    sumEl.innerHTML='<p class="empty">Pick your birth month to begin.</p>';
    rows.forEach(r=>{r.classList.remove('now');r.querySelector('.fill').style.width='0%';r.querySelector('.pct').textContent='0%'});
    return;
  }
  const [y,m]=v.split('-').map(Number);
  const dob=new Date(y,m-1,1);
  const age=Math.max(0,(now-dob)/(1000*60*60*24*365.25));
  const yrs=Math.floor(age), mos=Math.floor((age-yrs)*12);
  const left=Math.max(span-age,0);
  const lived=Math.min(age/span*100,100);

  rows.forEach((r,i)=>{
    const p=Math.min(Math.max((age-i*10)/10,0),1);
    r.classList.toggle('now',p>0&&p<1);
    r.querySelector('.fill').style.width=(p*100)+'%';
    r.querySelector('.pct').textContent=Math.round(p*100)+'%';
  });

  sumEl.innerHTML=`
    <h2>You have lived ${Math.round(lived)}% of a ${span}-year life.</h2>
    <div class="stats">
      <div class="stat"><b>${yrs}y ${mos}m</b><span>Your age</span></div>
      <div class="stat"><b>${Math.round(left)}</b><span>Years ahead</span></div>
      <div class="stat"><b>${Math.round(left*52.18).toLocaleString()}</b><span>Weeks ahead</span></div>
      <div class="stat"><b>${Math.round(left*365.25).toLocaleString()}</b><span>Days ahead</span></div>
    </div>`;
  try{localStorage.setItem('lid-dob',v);localStorage.setItem('lid-span',span)}catch(e){}
}

dobEl.addEventListener('input',render);
spanEl.addEventListener('input',render);

try{
  const d=localStorage.getItem('lid-dob'), s=localStorage.getItem('lid-span');
  if(s)spanEl.value=s;
  if(d)dobEl.value=d;
}catch(e){}
// Let the empty bars paint first so the fill animates in on load
requestAnimationFrame(()=>requestAnimationFrame(render));
</script>
</body>
</html>
